# The runner picker: chooses where a repo's CI jobs run (ADR 0004 in the owner's pc-hardening repo).
#
#   jobs:
#     pick:
#       uses: watsonsoft/ci-shared/.github/workflows/runner-picker.yml@v1
#       secrets: inherit                      # passes RUNNER_STATUS_TOKEN
#     test:
#       needs: pick
#       runs-on: ${{ fromJSON(needs.pick.outputs.runner) }}
#     deploy:                                 # deploy jobs never run on the pool
#       needs: pick
#       runs-on: ${{ fromJSON(needs.pick.outputs.fallback) }}
#
# The rule lives in picker/decide.sh: a fork pull request or a deploy job goes to the fallback;
# otherwise the pool when any pool runner is online (the job waits if all are busy, unless overflow
# mode is on); otherwise the fallback. The fallback is GitHub-hosted for a public repo and Ubicloud
# for a private one. The choice and the reason go to the job summary.
#
# Overflow mode is read at run time from settings.json on ci-shared's main (flipped by the owner's
# ci-overflow command), so it changes without a new tag. A repo variable CI_OVERFLOW (on|off)
# overrides it for that repo. Unreadable counts as off.
name: Runner picker

on:
  workflow_call:
    inputs:
      fallback-size:
        description: Ubicloud label for a private repo's fallback (default ubicloud-standard-2). A public repo's fallback is always ubuntu-latest.
        type: string
        default: ''
      deploy:
        description: True for a workflow whose jobs deploy; it always gets the fallback.
        type: boolean
        default: false
      force:
        description: pool or fallback, to validate a repo on one path. A fork pull request or deploy still gets the fallback.
        type: string
        default: ''
    secrets:
      RUNNER_STATUS_TOKEN:
        description: Fine-grained token with organization "Self-hosted runners read". Without it the job gets the fallback.
        required: false
    outputs:
      runner:
        description: The runner for fromJSON in runs-on.
        value: ${{ jobs.pick.outputs.runner }}
      fallback:
        description: The fallback runner for fromJSON in runs-on, for deploy jobs.
        value: ${{ jobs.pick.outputs.fallback }}
      pool:
        description: "'true' when the jobs go to the pool."
        value: ${{ jobs.pick.outputs.pool }}
      reason:
        description: Why.
        value: ${{ jobs.pick.outputs.reason }}

permissions:
  contents: read

jobs:
  pick:
    name: Pick the runner
    # The picker itself never runs on the pool: GitHub-hosted for a public repo, Ubicloud for a private one.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
      fallback: ${{ steps.decide.outputs.fallback }}
      pool: ${{ steps.decide.outputs.pool }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # The decision script at exactly the version the caller pinned.
      - name: Fetch the decision script
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: picker
          path: .ci-shared
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GITHUB_READ_TOKEN: ${{ github.token }}
          CI_SHARED: ${{ job.workflow_repository }}
          ORG: ${{ github.repository_owner }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          # A pull request whose head isn't this repo (a deleted fork's head counts as a fork).
          FORK: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository || false }}
          DEPLOY: ${{ inputs.deploy }}
          FALLBACK_SIZE: ${{ inputs.fallback-size }}
          FORCE: ${{ inputs.force }}
          REPO_OVERFLOW: ${{ vars.CI_OVERFLOW }}
          PICKER: ${{ job.workflow_ref }}
        run: |
          tmp=$RUNNER_TEMP/picker; mkdir -p "$tmp"
          # Overflow mode from main, not the pinned version. Unreadable leaves no file: off.
          for token in "$GITHUB_READ_TOKEN" "$STATUS_TOKEN"; do
            [ -n "$token" ] || continue
            if GH_TOKEN=$token gh api -H 'Accept: application/vnd.github.raw' \
                 "repos/$CI_SHARED/contents/settings.json?ref=main" > "$tmp/settings.json" 2>/dev/null; then break; fi
            rm -f "$tmp/settings.json"
          done
          args=(--visibility "$VISIBILITY" --fork "$FORK" --deploy "$DEPLOY"
                --settings "$tmp/settings.json" --repo-overflow "$REPO_OVERFLOW"
                --fallback-size "$FALLBACK_SIZE" --force "$FORCE")
          if [ -z "$STATUS_TOKEN" ]; then
            args+=(--runners-error "RUNNER_STATUS_TOKEN isn't set in this repo")
          elif GH_TOKEN=$STATUS_TOKEN gh api "orgs/$ORG/actions/runners?per_page=100" > "$tmp/runners.json" 2> "$tmp/runners.err"; then
            args+=(--runners "$tmp/runners.json")
          else
            args+=(--runners-error "$(head -c 300 "$tmp/runners.err" | tr '\n' ' ' | sed 's/ *$//')")
          fi
          .ci-shared/picker/decide.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT" > "$tmp/out"
          get() { sed -n "s/^$1=//p" "$tmp/out"; }
          {
            if [ "$(get pool)" = true ]; then echo "### Runner: the pool"; else echo "### Runner: fallback $(get runner)"; fi
            echo
            echo "$(get reason)."
            echo
            echo "runs-on: \`$(get runner)\` · overflow mode: $(get overflow) · picker: \`$PICKER\`"
          } >> "$GITHUB_STEP_SUMMARY"
