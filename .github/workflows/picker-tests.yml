# Seam 2: the runner picker's decision against saved runner-list responses.
name: Picker tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: picker/tests/test-decide.sh
