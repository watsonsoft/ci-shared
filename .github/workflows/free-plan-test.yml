# Ticket 01 (pc-hardening): proves a self-hosted runner in watsonsoft's Default group runs a public repo's job.
# Lives in watsonsoft/ci-shared as .github/workflows/free-plan-test.yml; removed once the test has passed.
name: free-plan-test
on: workflow_dispatch
jobs:
  test:
    runs-on: [self-hosted, free-plan-test]
    timeout-minutes: 5
    steps:
      - run: |
          echo "runner: $RUNNER_NAME"
          echo "repo: $GITHUB_REPOSITORY (public: ${{ !github.event.repository.private }})"
          uname -a
